name: Test Suite

on:
  workflow_dispatch:
  issue_comment:
    types: [ created, edited ]
jobs:
  unit-test:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request
      && contains(github.event.comment.body, '/run-tests')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11" ]
    steps:
      - name: Comment on PR with run link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(jq --raw-output .issue.number "$GITHUB_EVENT_PATH")
          COMMENT_BODY="✅ Tests triggered: [View Workflow Run](https://github.com/$REPO/actions/runs/$RUN_ID)"

          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments \
            -d "{\"body\":\"$COMMENT_BODY\"}"
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends poppler-utils
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.issue.pull_request.head.sha || github.sha }}
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          poetry install --without=dev --with=testing
      - name: Run Pytest
        env:
          # Environment configuration
          ENVIRONMENT: "TEST"
          OPENAI_API_TYPE: ${{ vars.OPENAI_API_TYPE }}

          # Application Configuration
          RATE_LIMIT_ENABLED: ${{ vars.RATE_LIMIT_ENABLED }}
          AUTH_ENABLED: ${{ vars.AUTH_ENABLED }}
          LLM_WEB_SEARCH_ENABLED: ${{ vars.LLM_WEB_SEARCH_ENABLED }}

          # API Keys (secrets)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JINA_AI_API_KEY: ${{ secrets.JINA_AI_API_KEY }}
          OPENBB_PAYMENTS_API_SECRET_KEY: ${{ secrets.OPENBB_PAYMENTS_API_SECRET_KEY }}

          # Test credentials
          OPENBB_TEST_EMAIL: ${{ secrets.OPENBB_TEST_EMAIL }}
          OPENBB_TEST_PASSWORD: ${{ secrets.OPENBB_TEST_PASSWORD }}

          # Base URLs (vars)
          JINA_AI_BASE_URL: ${{ vars.JINA_AI_BASE_URL }}
          OPENBB_PAYMENTS_BASE_URL: ${{ vars.OPENBB_PAYMENTS_BASE_URL }}
        run: |
          poetry run pytest --reruns 2 tests/ -m "stateful"  # run stateful tests serially
          poetry run pytest -n 8 --reruns 2 tests/  -m "not stateful"

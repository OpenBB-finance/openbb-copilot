[tool.poetry]
name = "openbb-ada"
version = "0.0.1"
description = "OpenBB Copilot / Ada"
authors = ["Michael Struwig <michael.struwig@openbb.finance>"]
readme = "README.md"

[tool.poetry.dependencies]
aiofiles = "^23.2.1"
fastapi = "^0.136.3"
gunicorn = "^26.0.0"
jinja2 = "^3.1.6"
magentic = "^0.41.0"
openpyxl = "^3.1.2"
python = "^3.12"
python-dotenv = "^1.2.2"
python-json-logger = "^2.0.7"
python-multipart = "^0.0.31"
sqlalchemy = "^2.0.44"
uvicorn = { extras = ["standard"], version = "^0.49.0" }
werkzeug = "^3.1.8"
tenacity = "^8.2.3"
async-lru = "^2.0.4"
httpx = "^0.28.1"
faiss-cpu = "^1.8.0"
tiktoken = "^0.9.0"
sse-starlette = "^2.1.2"
pandas = "^2.2.2"
pdfplumber = "^0.11.5"
redis = "^5.2.1"
xxhash = "^3.5.0"
posthog = "^3.14.1"
logfire = "^4.39.0"
python-docx = "^1.1.2"
sqlparse = "^0.5.5"
openbb-ai = "^2.2.0"

[tool.poetry.group.testing.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-xdist = "^3.8.0"
pytest-rerunfailures = "^16.1"
pytest-dotenv = "^0.5.2"
pytest-cov = "^7.1.0"

[tool.poetry.group.dev.dependencies]
mypy = "1.15.0"
pre-commit = "^3.7.1"
ruff = "^0.16.1"
types-redis = "^4.6.0"
types-pytz = "^2025.2.0.20250326"


[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "B", # flake8-bugbear
    "I", # isort
    "S", # security / flake8-bandit
]
ignore = [
    "S101", # ignore assert statements being used (for pytest)
]

[tool.mypy]
ignore_missing_imports = true
exclude = [
    "tests/.*"
]

[tool.pytest.ini_options]
addopts = "-n 8 -m 'not stateful'"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "stateful: marks tests as stateful tests, which should not be run in parallel. (deselect with '-m \"not stateful\"')",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
